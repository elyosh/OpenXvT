name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/linux/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XVT_BUILD_TYPE=${{ matrix.build-type }}
            XVT_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=linux

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxvt-linux-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.tar.xz
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.build-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Determine release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build package
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/windows/Dockerfile
          platforms: linux/amd64
          target: artifact
          build-args: |
            XVT_BUILD_TYPE=${{ matrix.build-type }}
            XVT_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=build/artifacts
          cache-from: type=gha,scope=windows

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openxvt-windows-x86_64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.build-type }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]
    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      - name: Determine runner image version
        id: runner-image
        run: echo "version=${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency caches
        uses: actions/cache@v6
        with:
          path: |
            build/cache/macos-arm64/sources
            build/cache/macos-arm64/dependencies
            build/cache/macos-arm64/tools
            build/cache/macos-arm64/build/sdl
            build/cache/macos-arm64/build/zstd
            build/cache/macos-arm64/build/ffmpeg
            build/cache/macos-arm64/build/shadercross
          key: macos-arm64-${{ steps.runner-image.outputs.version }}-deps-${{ hashFiles('packaging/macos/build-package.sh', 'aeron/packaging/dependencies/**') }}

      - name: Build package
        env:
          XVT_BUILD_TYPE: ${{ matrix.build-type }}
          XVT_MACOS_BUILD_VERSION: ${{ github.run_number }}
        run: |
          XVT_VERSION="${GITHUB_REF_NAME#v}" ./packaging/macos/build-package.sh

      # Signed by the sign-macos job, which publishes it as openxvt-*.
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-macos-arm64-${{ matrix.build-type == 'Debug' && 'debug' || 'release' }}
          path: build/artifacts/*.dmg
          if-no-files-found: error

  # The only job that can read the signing secrets. They are environment
  # secrets of macos-signing, which only v* tags can use and which waits for a
  # maintainer's approval. The job runs no code from Homebrew, caches or
  # unpinned actions, so nothing else runs next to the private key.
  sign-macos:
    name: Sign macOS packages
    needs: macos
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-signing
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unsigned-macos-arm64-*
          path: unsigned
          merge-multiple: true

      # A keychain that exists only for this job, with a random password. The
      # partition list lets codesign use the key without a prompt.
      - name: Install signing credentials
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "The macos-signing environment has no MACOS_${name} secret" >&2
              exit 1
            fi
          done

          umask 077
          secrets_dir="${RUNNER_TEMP}/signing"
          keychain="${secrets_dir}/signing.keychain-db"
          mkdir -p "${secrets_dir}"
          keychain_password="$(openssl rand -base64 32)"

          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          printf '%s' "${CERTIFICATE_P12}" | base64 --decode > "${secrets_dir}/certificate.p12"
          security import "${secrets_dir}/certificate.p12" -k "${keychain}" \
              -P "${CERTIFICATE_PASSWORD}" -f pkcs12 -T /usr/bin/codesign
          rm -f "${secrets_dir}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
              -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" \
              $(security list-keychains -d user | tr -d '"')

          # Sign with the certificate's hash so no other identity on the
          # runner can be picked.
          identities="$(security find-identity -v -p codesigning "${keychain}" |
              awk '/"Developer ID Application: / { print $2 }')"
          if [[ "$(printf '%s\n' "${identities}" | grep -c .)" -ne 1 ]]; then
            echo "MACOS_CERTIFICATE_P12 must hold exactly one Developer ID Application identity" >&2
            exit 1
          fi

          printf '%s\n' "${NOTARY_KEY_P8}" > "${secrets_dir}/notary.p8"
          {
            echo "XVT_MACOS_SIGN_IDENTITY=${identities}"
            echo "XVT_MACOS_NOTARY_KEY=${secrets_dir}/notary.p8"
            echo "XVT_MACOS_NOTARY_KEY_ID=${NOTARY_KEY_ID}"
            echo "XVT_MACOS_NOTARY_ISSUER=${NOTARY_ISSUER}"
          } >> "${GITHUB_ENV}"

      - name: Sign and notarize
        run: |
          mkdir -p signed
          for input in unsigned/*.dmg; do
            ./packaging/macos/sign-package.sh "${input}" "signed/$(basename "${input}")"
          done

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing/signing.keychain-db" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/signing"

      - name: Upload signed packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openxvt-macos-arm64
          path: signed/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: openxvt-*
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "OpenXvT ${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --generate-notes \
              artifacts/*
