      - {key: "Keypad Enter"}
    power_preset_recall_1:
      - {key: "9"}
    power_preset_recall_2:
      - {key: "0"}
    power_preset_store_1:
      - {key: "9", modifiers: [shift]}
    power_preset_store_2:
      - {key: "0", modifiers: [shift]}
    toggle_slam:
