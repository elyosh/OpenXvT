    toggle_s_foils:
      - {key: "V"}
    view_toggle_high_angle:
      - {key: "Keypad 0"}
    view_toggle_cockpit:
      - {key: "."}
      - {key: "Keypad ."}
    toggle_external_camera_or_follow_map_target:
      - {key: "/"}
      - {key: "Keypad /"}
    toggle_camera_control_or_stop_following_map_target:
      - {key: "8", modifiers: [shift]}
      - {key: "Keypad *"}
    view_left_shoulder:
      - {key: "Keypad 1"}
    view_rear:
      - {key: "Keypad 2"}
    view_right_shoulder:
      - {key: "Keypad 3"}
    view_left_wing:
      - {key: "Keypad 4"}
    view_straight_up:
      - {key: "Keypad 5"}
    view_right_wing:
