# OpenXvT shipped defaults. USER/config.yaml recursively overrides these values.
# Shared scene defaults are loaded from aeron/scene3d_defaults.yaml first.
# Keep legacy game flags as integers; modern settings use YAML booleans.
# Renderer distances use native game units. MSAA and FSR are mutually exclusive;
# selecting FSR makes the effective MSAA sample count 1.
version: 3
startup:
  skip_intro: false
ui:
  font: assets/fonts/menu
paths:
  game_data: ""
video:
  window_mode: "windowed"
input:
  mouse_flight: false
  mouse_sensitivity: 5
  mouse_invert_y: false
  keyboard:
    fire_weapon:
      - {key: "2", modifiers: [alt]}
    cycle_weapon_group:
      - {key: "W"}
    cycle_weapon_firing_mode:
      - {key: "X"}
    fire_countermeasure_or_center_map_target:
      - {key: "C"}
    toggle_beam:
      - {key: "B"}
    cycle_beam_recharge_rate:
      - {key: "F8"}
    cycle_cannon_recharge_rate:
      - {key: "F9"}
    cycle_shield_recharge_rate:
      - {key: "F10"}
    cycle_shield_mode:
      - {key: "S"}
    xfer_cannon_to_shields:
      - {key: "'"}
      - {key: "F10", modifiers: [shift]}
    xfer_shields_to_cannon:
      - {key: ";"}
      - {key: "F9", modifiers: [shift]}
    xfer_all_cannon_to_shields:
      - {key: "'", modifiers: [shift]}
    target_roll_modifier: []
    auto_target:
      - {key: "1", modifiers: [alt]}
    target_next:
      - {key: "T"}
    target_prev:
      - {key: "Y"}
    target_nearest_fighter_or_mine:
      - {key: "R"}
    target_my_attacker:
      - {key: "E"}
    target_attacker_chain:
      - {key: "A"}
    target_newest_craft:
      - {key: "U"}
    target_objective:
      - {key: "O"}
    target_nearest_hostile_player:
      - {key: "P"}
    target_next_player:
      - {key: "P", modifiers: [shift]}
    target_incoming_warhead:
      - {key: "I"}
    target_next_friendly:
      - {key: "F1"}
    target_prev_friendly:
      - {key: "F2"}
    target_next_enemy:
      - {key: "F3"}
    target_prev_enemy:
      - {key: "F4"}
    target_component_next:
      - {key: ","}
    target_component_prev:
      - {key: ",", modifiers: [shift]}
    target_clear:
      - {key: "C", modifiers: [alt]}
    toggle_threat_display_or_zoom_map_target:
      - {key: "Z"}
    target_preset_store_1:
      - {key: "F5", modifiers: [shift]}
    target_preset_store_2:
      - {key: "F6", modifiers: [shift]}
    target_preset_store_3:
      - {key: "F7", modifiers: [shift]}
    target_preset_recall_1:
      - {key: "F5"}
    target_preset_recall_2:
      - {key: "F6"}
    target_preset_recall_3:
      - {key: "F7"}
    throttle_up:
      - {key: "="}
      - {key: "=", modifiers: [shift]}
    throttle_down:
      - {key: "-"}
    throttle_up_or_track_map_target:
      - {key: "Keypad +"}
    throttle_down_or_stop_tracking_map_target:
      - {key: "Keypad -"}
    throttle_zero:
